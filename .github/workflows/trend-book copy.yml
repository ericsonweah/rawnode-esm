name: rawnode-esm-trend-book

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly @ 03:00 UTC

permissions:
  contents: read

concurrency:
  group: trend-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Prepare output folder
        run: mkdir -p ./out

      - name: 🔁 Run converter & emit JSON report
        run: |
          node ./run.mjs \
            --target ./src \
            --json-report \
            --report ./out/report-%DATE%.json \
            --report-summary

      - name: 📚 Build trend book (JSON + CSV)
        run: |
          node tools/trend-book.mjs \
            --dir ./out \
            --recursive \
            --bucket week \
            --out ./out/trend-book.json \
            --csv ./out/trend-book.csv \
            --pretty=false

      - name: 📎 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rawnode-esm-trend-artifacts
          path: |
            out/report-*.json
            out/trend-book.json
            out/trend-book.csv
          if-no-files-found: warn
